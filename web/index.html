<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <title>QR Code Generator: private, offline, no tracking</title>
    <meta
      name="description"
      content="Make styled QR codes entirely in your browser. No sign-up, no tracking redirects, no analytics, and nothing you type leaves the page."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QR Code Generator" />
    <meta property="og:title" content="QR Code Generator: private, offline, no tracking" />
    <meta
      property="og:description"
      content="Styled QR codes made entirely in your browser. No sign-up, no tracking redirects, nothing leaves the page."
    />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A styled QR code beside the words QR Code Generator: made in your browser." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
