services:
  qr-code-generator:
    build:
      context: .
    image: qr-code-generator:local
    container_name: qr-code-generator
    restart: unless-stopped

    # Published so the LAN address works alongside the Traefik hostname.
    # 8640 is clear of everything else in ~/services.
    ports:
      - "8640:8640"

    environment:
      - PORT=8640

    # No volumes: QR codes are made in the browser and the server keeps
    # nothing. Styles and presets live in each browser's localStorage.
    read_only: true

    labels:
      # Rebuilt from source here, so there is no upstream image to watch.
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.http.routers.qr.rule=Host(`qr.internal.home.ifupdown.com`)"
      - "traefik.http.routers.qr.entrypoints=websecure"
      - "traefik.http.routers.qr.tls.certresolver=cloudflare"
      - "traefik.http.services.qr.loadbalancer.server.port=8640"

    networks:
      - proxy

networks:
  proxy:
    external: true
